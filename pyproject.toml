[project]
name = "backtester"
version = "0.2.0"
description = "Strategy Lab: natural-language → walk-forward backtest, plus the regime-switching research code"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpyro>=0.15",
    "yfinance>=0.2.40",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "anthropic>=0.40",
    "openai>=1.30",
    "tabulate>=0.9",
    "prompt-toolkit>=3.0",
    "rich>=13.0",
    "filelock>=3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
# Pull these in for paper/live trading: `uv pip install -e .[live]`
live = [
    "alpaca-py>=0.30",
]

[project.scripts]
lab = "lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["regime_model/tests", "tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that hit the network or are otherwise slow",
    "live_llm: tests that hit the live Anthropic API",
    "live: tests that hit the real Alpaca paper endpoint; require RUN_LIVE_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["regime_model*", "lab*"]
