[project]
name = "regime_model"
version = "0.1.0"
description = "Online Bayesian regime-switching model for cross-asset allocation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpyro>=0.15",
    "yfinance>=0.2.40",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["regime_model/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that hit the network or are otherwise slow",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["regime_model*"]
